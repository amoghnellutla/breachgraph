name: breachgraph security gate
description: >-
  Run Semgrep, Gitleaks, Trivy, Checkov and zizmor in one step, link the
  findings to code, Kubernetes, cloud IAM and CI into attack paths, and tell each pull request
  whether it opens or closes a path to your crown jewels.
author: breachgraph contributors
branding:
  icon: shield
  color: red

inputs:
  path:
    description: Directory to scan, relative to the workspace.
    default: "."
  config:
    description: "Path to .breachgraph.yml (default: <path>/.breachgraph.yml if present)."
    default: ""
  baseline:
    description: Baseline file of accepted findings (default <path>/.breachgraph-baseline.json if present).
    default: ""
  fail-on:
    description: Priority threshold that fails the job (P1-P4 or none). Overrides the config file.
    default: ""
  only:
    description: Comma-separated scanners to run (semgrep,gitleaks,trivy,checkov,zizmor,cicd).
    default: ""
  skip:
    description: Comma-separated scanners to skip.
    default: ""
  imports:
    description: >-
      Comma-separated reports from earlier steps to merge, as TOOL=PATH relative to the workspace
      (for example zap=report_json.json,sarif=codeql.sarif).
    default: ""
  slack-webhook:
    description: Slack incoming webhook URL (pass a secret). Alerts when a change opens an attack path.
    default: ""
  teams-webhook:
    description: Microsoft Teams Workflows webhook URL (pass a secret). Same alerts as Slack.
    default: ""
  images:
    description: Comma-separated container images to scan with Trivy.
    default: ""
  comment:
    description: Post / update a summary comment on pull requests.
    default: "true"
  issues:
    description: Open a GitHub issue per finding at this priority or above (e.g. P1). Empty = off.
    default: ""
  upload-sarif:
    description: Upload SARIF to GitHub code scanning (needs security-events write).
    default: "true"
  output-dir:
    description: Where reports are written (uploaded as a workflow artifact).
    default: breachgraph-report
  version:
    description: breachgraph image tag to use.
    default: "v0"
  image:
    description: Full image reference; overrides `version` (e.g. a mirror or a locally built image).
    default: ""
  extra-args:
    description: Extra arguments passed to `breachgraph scan`.
    default: ""
  compare:
    description: >-
      Compare pull requests with the default branch's last report (kept in the Actions cache), so
      only what the PR adds can fail it and the comment says which attack paths it opens or closes.
    default: "true"
  token:
    description: Token for PR comments and issues.
    default: ${{ github.token }}

outputs:
  passed:
    description: '"true" if the gate passed.'
    value: ${{ steps.scan.outputs.passed }}
  findings:
    description: Number of open (non-suppressed) findings.
    value: ${{ steps.scan.outputs.findings }}
  gating:
    description: Number of findings that fail the gate.
    value: ${{ steps.scan.outputs.gating }}
  sarif:
    description: Path of the SARIF report.
    value: ${{ inputs.output-dir }}/breachgraph.sarif

runs:
  using: composite
  steps:
    - name: Cache vulnerability DB and enrichment feeds
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/breachgraph-cache
        key: breachgraph-cache-${{ runner.os }}-${{ github.run_id }}
        restore-keys: breachgraph-cache-${{ runner.os }}-

    - name: Restore the default branch's report
      if: ${{ inputs.compare == 'true' && github.event_name == 'pull_request' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/breachgraph-base
        key: breachgraph-report-${{ github.event.pull_request.base.sha }}
        restore-keys: breachgraph-report-

    - name: Run breachgraph
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        SG_PATH: ${{ inputs.path }}
        SG_CONFIG: ${{ inputs.config }}
        SG_BASELINE: ${{ inputs.baseline }}
        SG_FAIL_ON: ${{ inputs.fail-on }}
        SG_ONLY: ${{ inputs.only }}
        SG_SKIP: ${{ inputs.skip }}
        SG_IMPORTS: ${{ inputs.imports }}
        BREACHGRAPH_SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
        BREACHGRAPH_TEAMS_WEBHOOK: ${{ inputs.teams-webhook }}
        SG_IMAGES: ${{ inputs.images }}
        SG_COMMENT: ${{ inputs.comment }}
        SG_ISSUES: ${{ inputs.issues }}
        SG_OUT: ${{ inputs.output-dir }}
        SG_IMAGE: ${{ inputs.image || format('ghcr.io/amoghnellutla/breachgraph:{0}', inputs.version) }}
        SG_EXTRA: ${{ inputs.extra-args }}
        SG_CACHE: ${{ runner.temp }}/breachgraph-cache
        SG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SG_BASE_REPORT: ${{ runner.temp }}/breachgraph-base/breachgraph.json
      run: |
        set -uo pipefail
        mkdir -p "$SG_CACHE"
        args=(scan "$SG_PATH" --output-dir "$SG_OUT" --format json,sarif,html,md,junit,openvex)
        [[ -n "$SG_CONFIG" ]]   && args+=(--config "$SG_CONFIG")
        [[ -n "$SG_BASELINE" ]] && args+=(--baseline "$SG_BASELINE")
        [[ -n "$SG_FAIL_ON" ]]  && args+=(--fail-on "$SG_FAIL_ON")
        [[ -n "$SG_ONLY" ]]     && args+=(--only "$SG_ONLY")
        [[ -n "$SG_SKIP" ]]     && args+=(--skip "$SG_SKIP")
        [[ "$SG_COMMENT" == "true" ]] && args+=(--github-comment)
        if [[ -n "$SG_ISSUES" ]]; then
          args+=(--github-issues "$SG_ISSUES")
          # Only the default branch knows a finding is really gone.
          [[ "${GITHUB_REF_NAME:-}" == "$SG_DEFAULT_BRANCH" ]] && args+=(--close-fixed-issues)
        fi
        IFS=',' read -ra imgs <<< "$SG_IMAGES"
        for img in "${imgs[@]}"; do [[ -n "${img// }" ]] && args+=(--image "${img// }"); done
        IFS=',' read -ra reports <<< "$SG_IMPORTS"
        for r in "${reports[@]}"; do [[ -n "${r// }" ]] && args+=(--import "${r// }"); done
        if [[ -f "$SG_BASE_REPORT" ]]; then
          cp "$SG_BASE_REPORT" "$GITHUB_WORKSPACE/.breachgraph-base.json"
          args+=(--compare .breachgraph-base.json)
        fi
        # shellcheck disable=SC2206
        extra=($SG_EXTRA)

        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$GITHUB_WORKSPACE:/src" -w /src \
          -v "$SG_CACHE:/tmp/breachgraph-cache" \
          -e BREACHGRAPH_CACHE_DIR=/tmp/breachgraph-cache \
          -e TRIVY_CACHE_DIR=/tmp/breachgraph-cache/trivy \
          -e GITHUB_ACTIONS -e GITHUB_TOKEN -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_REF_NAME \
          -e GITHUB_RUN_ID -e GITHUB_SERVER_URL -e GITHUB_API_URL \
          -e BREACHGRAPH_SLACK_WEBHOOK -e BREACHGRAPH_TEAMS_WEBHOOK \
          -e GITHUB_EVENT_PATH=/github/event.json -v "$GITHUB_EVENT_PATH:/github/event.json:ro" \
          -e GITHUB_STEP_SUMMARY=/github/summary.md -v "$GITHUB_STEP_SUMMARY:/github/summary.md" \
          "$SG_IMAGE" "${args[@]}" "${extra[@]}"
        code=$?
        rm -f "$GITHUB_WORKSPACE/.breachgraph-base.json"
        if [[ -f "$SG_OUT/breachgraph.json" && "${GITHUB_EVENT_NAME:-}" == "push" && "${GITHUB_REF_NAME:-}" == "$SG_DEFAULT_BRANCH" ]]; then
          mkdir -p "$RUNNER_TEMP/breachgraph-base" && cp "$SG_OUT/breachgraph.json" "$RUNNER_TEMP/breachgraph-base/"
          echo "base_saved=true" >> "$GITHUB_OUTPUT"
        fi

        if [[ -f "$SG_OUT/breachgraph.json" ]]; then
          python3 - "$SG_OUT/breachgraph.json" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        r = json.load(open(sys.argv[1], encoding="utf-8"))
        open_ = [f for f in r["findings"] if f["status"] != "suppressed"]
        print(f"passed={'true' if r['gate']['passed'] else 'false'}")
        print(f"findings={len(open_)}")
        print(f"gating={sum(1 for f in r['findings'] if f['gating'])}")
        PY
        fi
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"

    - name: Keep this report for pull requests to compare against
      if: ${{ always() && inputs.compare == 'true' && steps.scan.outputs.base_saved == 'true' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/breachgraph-base
        key: breachgraph-report-${{ github.sha }}

    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(format('{0}/breachgraph.sarif', inputs.output-dir)) != '' }}
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      continue-on-error: true  # fork PRs and private repos without GHAS cannot upload
      with:
        sarif_file: ${{ inputs.output-dir }}/breachgraph.sarif
        category: breachgraph

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: breachgraph-report
        path: ${{ inputs.output-dir }}
        if-no-files-found: ignore

    - name: Apply gate result
      if: always()
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit_code }}
      run: |
        if [[ "${CODE:-1}" != "0" ]]; then
          echo "::error title=breachgraph::Security gate failed (exit ${CODE:-unknown}). See the job summary and breachgraph-report artifact."
          exit "${CODE:-1}"
        fi
