# Benchmark targets. Each is cloned at the pinned commit when the benchmark runs; nothing is
# vendored, so every project keeps its own license. Bump a SHA deliberately and re-label its paths.
#
# kind: vulnerable = intentionally vulnerable training project (paths are expected)
#       control    = a well-maintained real project (measures noise on normal code)

- name: terragoat
  repo: https://github.com/bridgecrewio/terragoat
  sha: 729f8da62c6a85ce4af5ad3d123de97776d954c4
  kind: vulnerable
  license: Apache-2.0
  covers: Terraform misconfigurations across AWS, Azure and GCP
  scenarios: https://github.com/bridgecrewio/terragoat#readme

- name: kubernetes-goat
  repo: https://github.com/madhuakula/kubernetes-goat
  sha: 723a0db478f050d173d23b4ce5044b65bce0bdd0
  kind: vulnerable
  license: MIT
  covers: Kubernetes workloads, RBAC, container escape, secrets, vulnerable apps
  scenarios: https://madhuakula.com/kubernetes-goat/docs/scenarios

- name: cloudgoat
