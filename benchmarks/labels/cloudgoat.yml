summary: >
  CloudGoat is a collection of AWS privilege-escalation scenarios. Almost all of them start from
  IAM user access keys handed to the player, which is not a path from the internet. breachgraph
  evaluates every IAM policy, user, group and AssumeRole trust in the repository; only one scenario
  starts from the internet. The key-based scenarios appear with the credentials entry point turned
  on; see the assumed-breach section below.
paths:
  - key: "Internet -> S3 bucket index_bucket"
    verdict: true
    why: >
      A bucket policy grants public read with all public access blocks disabled
      (scenarios/aws/s3_version_rollback_via_cfn/terraform/s3.tf:153). It is the scenario's public
      index, a website by design, which a team would exclude with an attack_graph.crown_jewels override.
misses:
  - scenario: IAM privilege-escalation scenarios that begin with leaked or provided IAM user keys (iam_privesc_by_rollback, by_attachment, ...).
    why: >
      Not a path from the internet: the player is handed the keys. With the credentials entry point
      these chains are found (assumed-breach section below).
