summary: >
  OWASP Juice Shop is a deliberately vulnerable Node.js shop with no cloud or Kubernetes
  configuration. Its infrastructure/docker-compose.yml runs the app behind an nginx proxy that
  publishes ports 80 and 443, and the code talks to its database through Sequelize. breachgraph
  models that database as the crown jewel and reports three independent ways to it, each named by
  the route that reaches it.
paths:
  - key: "Internet -> compose service juice-shop -> POST /rest/user/login -> Application database (Sequelize)"
    verdict: true
    why: >
      The SQL injection in the login route (routes/login.ts:34), where user input is concatenated into a
      Sequelize query: the challenge Juice Shop is best known for.
  - key: "Internet -> compose service juice-shop -> GET /rest/products/search -> Application database (Sequelize)"
    verdict: true
    why: >
      The UNION SQL injection in product search (routes/search.ts:23), reached through searchProducts.
      The app is reached through nginx on port 80 (infrastructure/docker-compose.yml).
  - key: "Internet -> compose service juice-shop -> GET /profile -> Application database (Sequelize)"
    verdict: true
    why: >
      The server-side template injection challenge: a username written as #{...} is passed to eval
      (routes/userProfile.ts:65), which runs code in the app and so can use its database connection.
  - key: "Internet -> compose service juice-shop -> Application database (Sequelize)"
    verdict: false
    why: >
      A sample answer for a coding challenge (data/static/codefixes/dbSchemaChallenge_1.ts), served as
      text and never run. No route reaches it, so it is low confidence and doesn't gate.
misses: []
