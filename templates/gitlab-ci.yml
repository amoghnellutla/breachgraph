# breachgraph for GitLab CI. Include it from your .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/OWNER/breachgraph/v0/templates/gitlab-ci.yml
#
# Gating findings show up as failed tests in the merge request (JUnit), and the full HTML
# report is kept as a job artifact.

breachgraph:
  stage: test
  image:
    name: ghcr.io/OWNER/breachgraph:v0
    entrypoint: [""]
  variables:
    BREACHGRAPH_ARGS: ""
    BREACHGRAPH_CACHE_DIR: "$CI_PROJECT_DIR/.breachgraph-cache"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.breachgraph-cache/trivy"
  cache:
    key: breachgraph
    paths: [.breachgraph-cache/]
  script:
    - breachgraph scan . --output-dir breachgraph-report --format json,sarif,html,md,junit $BREACHGRAPH_ARGS
  artifacts:
    when: always
    paths: [breachgraph-report/]
    reports:
      junit: breachgraph-report/breachgraph-junit.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
