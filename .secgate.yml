# secgate's own policy (used by .github/workflows/self-scan.yml).
version: 1

exclude_paths:
  - .git/
  - node_modules/
  - "**/.venv/"
  - "**/__pycache__/"
  - secgate-report/
  - .tmp/
  - demo-report/
  # Deliberately vulnerable demo target and captured scanner output used as test fixtures.
  - examples/vulnerable-app/
  - tests/fixtures/

fail_on:
  priority: P2
  kev: true
  secrets: true
  new_only: true
