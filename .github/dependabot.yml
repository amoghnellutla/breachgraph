version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases age before adopting them
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    # The scanner locks are separate environments that conflict on purpose (each gets its own
    # virtualenv); they are regenerated together with scripts/lock.py.
    exclude-paths:
      - "requirements/**"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases age before adopting them
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases age before adopting them
