# Re-runs the public benchmark (docs/benchmark.md) on demand. Results are uploaded as an artifact
# to compare with benchmarks/results/; labeling and publishing stay a reviewed, manual step.
name: benchmark

on:
  workflow_dispatch:
    inputs:
      only:
        description: Target name to run (empty = all)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: breachgraph:dev
          cache-from: type=gha
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/tools.txt
      - name: Run
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          [[ -n "$ONLY" ]] && args+=(--only "$ONLY")
          python benchmarks/run.py "${args[@]}"
      - name: Compare with the published labels
        run: |
          python benchmarks/report.py --check || echo "::warning::results changed: re-label and rebuild docs/benchmark.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results
