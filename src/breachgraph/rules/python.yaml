# breachgraph's own rules, written for this project (Apache-2.0).
#
# Each covers one way a request becomes an attacker's step on a path. "tainted" rules start from
# request data. "parameter" rules start from a function's parameters: they find a sink inside a
# helper, and the attack graph's call graph then decides whether any route reaches it.
rules:
  - id: breachgraph.python.command-injection-tainted
    mode: taint
    languages: [python]
    severity: ERROR
    message: Data from the request reaches a shell command.
    metadata:
      cwe: ["CWE-78: OS Command Injection"]
      confidence: HIGH
    pattern-sources: &py-request
      - pattern: flask.request.$X
      - pattern: request.$X
      - pattern: self.request.$X
    pattern-sinks: &py-command
      - pattern: os.system($X)
      - pattern: os.popen($X)
      - patterns:
          - pattern: subprocess.$F($X, ..., shell=True, ...)
          - focus-metavariable: $X
  - id: breachgraph.python.command-injection-parameter
    mode: taint
    languages: [python]
    severity: WARNING
    message: A function's parameter reaches a shell command. Dangerous if a request can reach this function.
    metadata:
      cwe: ["CWE-78: OS Command Injection"]
      confidence: MEDIUM
    pattern-sources: &py-parameter
      - patterns:
          - pattern-inside: |
              def $F(..., $P, ...):
                ...
          - focus-metavariable: $P
    pattern-sinks: *py-command

  - id: breachgraph.python.code-injection-tainted
    mode: taint
    languages: [python]
    severity: ERROR
    message: Data from the request is evaluated as code, or deserialized into objects.
    metadata:
      cwe: ["CWE-94: Code Injection"]
      confidence: HIGH
    pattern-sources: *py-request
    pattern-sinks: &py-code
      - pattern: eval($X)
      - pattern: exec($X)
      - pattern: pickle.loads($X)
      - pattern: marshal.loads($X)
      - pattern: yaml.unsafe_load($X)
      - pattern: flask.render_template_string($X, ...)
      - pattern: render_template_string($X, ...)
      - pattern: jinja2.Template($X, ...)
  - id: breachgraph.python.code-injection-parameter
    mode: taint
    languages: [python]
    severity: WARNING
    message: A function's parameter is evaluated as code. Dangerous if a request can reach this function.
    metadata:
      cwe: ["CWE-94: Code Injection"]
      confidence: MEDIUM
    pattern-sources: *py-parameter
    pattern-sinks: *py-code

  - id: breachgraph.python.sql-injection-tainted
    mode: taint
    languages: [python]
    severity: ERROR
    message: Data from the request is built into a SQL statement.
    metadata:
      cwe: ["CWE-89: SQL Injection"]
      confidence: HIGH
    pattern-sources: *py-request
    pattern-sinks: &py-sql
      - patterns:
          - pattern-either:
              - pattern: $C.execute($Q, ...)
              - pattern: $C.executemany($Q, ...)
              - pattern: $C.raw($Q, ...)
              - pattern: sqlalchemy.text($Q)
              - pattern: text($Q)
          - focus-metavariable: $Q
  - id: breachgraph.python.sql-injection-parameter
    mode: taint
    languages: [python]
    severity: WARNING
    message: A function's parameter is built into a SQL statement. Dangerous if a request can reach this function.
    metadata:
      cwe: ["CWE-89: SQL Injection"]
      confidence: MEDIUM
    pattern-sources: *py-parameter
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.execute(f"...", ...)
              - pattern: $C.execute("..." % $A, ...)
              - pattern: $C.execute("..." + $A, ...)
              - pattern: $C.execute($S.format(...), ...)
              - pattern: text(f"...")

  - id: breachgraph.python.sql-string-parameter
    mode: taint
    languages: [python]
    severity: WARNING
    message: A function's parameter is concatenated into a SQL statement. Dangerous if a request can reach this function.
    metadata:
      cwe: ["CWE-89: SQL Injection"]
      confidence: MEDIUM
    pattern-sources: *py-parameter
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  "$SQL" + $X
              - pattern: |
                  "$SQL" + $X + ...
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)^\s*(select|insert|update|delete)\s.*
          - focus-metavariable: $X

  - id: breachgraph.python.ssrf-tainted
    mode: taint
    languages: [python]
    severity: ERROR
    message: A URL from the request is fetched by the server.
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery"]
      confidence: HIGH
    pattern-sources: *py-request
    pattern-sinks: &py-ssrf
      - patterns:
          - pattern-either:
              - pattern: requests.$M($U, ...)
              - pattern: httpx.$M($U, ...)
              - pattern: urllib.request.urlopen($U, ...)
              - pattern: urlopen($U, ...)
              - patterns: # a session: any other .get is a dictionary lookup
                  - pattern: $S.get($U, ...)
                  - metavariable-regex:
                      metavariable: $S
                      regex: (?i).*(session|client|http)$
          - focus-metavariable: $U
  - id: breachgraph.python.ssrf-parameter
    mode: taint
    languages: [python]
    severity: WARNING
    message: A function's parameter is used as a URL to fetch. Dangerous if a request can reach this function.
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery"]
      confidence: MEDIUM
    pattern-sources: *py-parameter
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$M($U, ...)
              - pattern: httpx.$M($U, ...)
              - pattern: urllib.request.urlopen($U, ...)
              - pattern: urlopen($U, ...)
          - focus-metavariable: $U

  - id: breachgraph.python.path-traversal-tainted
    mode: taint
    languages: [python]
    severity: ERROR
    message: A file path from the request is opened by the server.
    metadata:
      cwe: ["CWE-22: Path Traversal"]
      confidence: HIGH
    pattern-sources: *py-request
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($P, ...)
              - pattern: send_file($P, ...)
              - pattern: flask.send_file($P, ...)
              - pattern: FileResponse($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: secure_filename(...)
      - pattern: os.path.basename(...)
  - id: breachgraph.python.hardcoded-signing-key
    languages: [python]
    severity: WARNING
    message: A login token is signed with a key from the source code, so anyone who reads it can forge a login.
    metadata:
      cwe: ["CWE-321: Use of Hard-coded Cryptographic Key"]
      confidence: MEDIUM
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: jwt.encode($P, "$V", ...)
              - pattern: jwt.decode($T, "$V", ...)
              - pattern: $APP.secret_key = "$V"
              - pattern: $APP.config["SECRET_KEY"] = "$V"
          - metavariable-regex:
              metavariable: $V
              regex: .{4,}
      - patterns:
          - pattern-either:
              - pattern: os.environ.get("$K", "$V")
              - pattern: os.getenv("$K", "$V")
          - metavariable-regex:
              metavariable: $K
              regex: (?i).*(jwt|signing|session_secret|secret_key).*
          - metavariable-regex:
              metavariable: $V
              regex: .{4,}
  - id: breachgraph.python.model-output-execution
    mode: taint
    languages: [python]
    severity: WARNING
    message: Text from a language model reaches code execution. Prompt injection in anything the model reads then runs here.
    metadata:
      cwe: ["CWE-94: Improper Control of Generation of Code"]
      confidence: MEDIUM
    pattern-sources:
      - pattern: $C.chat.completions.create(...)
      - pattern: $C.responses.create(...)
      - pattern: $C.messages.create(...)
      - pattern: $M.generate_content(...)
      - pattern: $CHAIN.invoke(...)
      - pattern: $LLM.predict(...)
    pattern-sinks:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: os.system(...)
      - pattern: subprocess.$F(..., shell=True, ...)
      - pattern: $CURSOR.execute(...)
  - id: breachgraph.python.deserialization-parameter
    mode: taint
    languages: [python]
    severity: WARNING
    message: A function's parameter is deserialized, which can run code. Dangerous if a request can reach this function.
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      confidence: MEDIUM
    pattern-sources: *py-parameter
    pattern-sinks:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: dill.loads(...)
      - pattern: jsonpickle.decode(...)
      - pattern: yaml.load($X)  # a custom Loader is usually a SafeLoader subclass
      - pattern: yaml.load(..., Loader=yaml.Loader, ...)
      - pattern: yaml.load(..., Loader=yaml.UnsafeLoader, ...)
      - pattern: yaml.load(..., Loader=yaml.FullLoader, ...)
      - patterns:
          - pattern: torch.load(...)
          - pattern-not: torch.load(..., weights_only=True, ...)
