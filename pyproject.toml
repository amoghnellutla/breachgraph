[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "breachgraph"
version = "0.3.0"
description = "Finds the attack paths in a repository. Links Semgrep, Gitleaks, Trivy, Checkov and zizmor findings to your code, Kubernetes, cloud IAM (AWS, Azure, GCP) and GitHub Actions, and fails a pull request when it opens a way from the internet to your data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "breachgraph contributors" }]
keywords = ["security", "devsecops", "appsec", "attack-path", "sast", "sca", "sarif", "iac", "cloud-security", "github-actions", "supply-chain", "mitre-attack", "kubernetes", "terraform", "semgrep", "trivy", "gitleaks", "checkov", "zizmor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "python-hcl2>=8.1",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.25",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
ai = ["anthropic>=1.13"]
dev = [
    "anthropic>=1.13",  # so the ai module type-checks consistently in CI
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "jsonschema>=4.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
breachgraph = "breachgraph.cli:app"

[project.urls]
Homepage = "https://github.com/amoghnellutla/breachgraph"
Documentation = "https://github.com/amoghnellutla/breachgraph/tree/main/docs"
Issues = "https://github.com/amoghnellutla/breachgraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/breachgraph"]

[tool.hatch.build.targets.sdist]
include = ["src/breachgraph", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = ["S603", "S607"]  # subprocess use is the whole point; args are lists, never shell=True

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S314", "E501"]
"src/breachgraph/reporters/html.py" = ["E501"]  # nosemgrep comment must stay on one line
"benchmarks/report.py" = ["E501"]  # generated Markdown prose and table rows

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["breachgraph"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jinja2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
