[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "secgate"
version = "0.1.0"
description = "One security gate for your CI: runs Semgrep, Gitleaks, Trivy, Checkov and ZAP, deduplicates and risk-scores findings (CISA KEV + EPSS), and enforces policy with baselines."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "secgate contributors" }]
keywords = ["security", "devsecops", "sast", "sca", "sarif", "semgrep", "trivy", "gitleaks", "checkov", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "jsonschema>=4.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
secgate = "secgate.cli:app"

[project.urls]
Homepage = "https://github.com/OWNER/secgate"
Documentation = "https://github.com/OWNER/secgate/tree/main/docs"
Issues = "https://github.com/OWNER/secgate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/secgate"]

[tool.hatch.build.targets.sdist]
include = ["src/secgate", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = ["S603", "S607"]  # subprocess use is the whole point; args are lists, never shell=True

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S314", "E501"]
"src/secgate/reporters/html.py" = ["E501"]  # nosemgrep comment must stay on one line

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["secgate"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jinja2.*"]
ignore_missing_imports = true
